<!DOCTYPE html>
<html lang="en">
<head>
    <meta charset="UTF-8">
    <meta name="viewport" content="width=device-width, initial-scale=1.0">
    <title>SYNTHOS Live Intelligence Map</title>
    <script src="https://d3js.org/d3.v7.min.js"></script>
    <style>
        :root {
            --bg: #030303;
            --accent: #22c55e;
            --text: #f8fafc;
            --muted: #64748b;
            --border: rgba(255,255,255,0.05);
            --blue: #3b82f6;
            --red: #ef4444;
            --purple: #a855f7;
            --orange: #f59e0b;
        }
        body {
            margin: 0; background: var(--bg); color: var(--text);
            font-family: 'Inter', system-ui, sans-serif;
            overflow: hidden;
        }
        #viz { width: 100vw; height: 100vh; cursor: grab; }
        .controls {
            position: absolute; top: 20px; left: 20px;
            background: rgba(10,10,12,0.9);
            backdrop-filter: blur(20px);
            padding: 24px; border-radius: 16px;
            border: 1px solid var(--border);
            max-width: 320px;
            box-shadow: 0 10px 40px rgba(0,0,0,0.5);
        }
        .node-info {
            position: absolute; bottom: 20px; right: 20px;
            background: rgba(10,10,12,0.9);
            padding: 16px; border-radius: 12px;
            border: 1px solid var(--border);
            font-family: monospace; font-size: 11px;
            min-width: 200px;
        }
        h1 { margin: 0 0 4px 0; font-size: 20px; font-weight: 800; background: linear-gradient(135deg, #fff, #94a3b8); -webkit-background-clip: text; -webkit-text-fill-color: transparent; }
        .status-badge { display: flex; align-items: center; gap: 8px; font-size: 11px; font-weight: 700; text-transform: uppercase; margin-bottom: 20px; }
        .status-dot { width: 8px; height: 8px; border-radius: 50%; background: #333; }
        .status-dot.online { background: var(--accent); box-shadow: 0 0 10px var(--accent); }
        
        .btn-group { display: flex; gap: 8px; margin-top: 16px; }
        .btn { 
            flex: 1; padding: 8px; border-radius: 6px; border: 1px solid var(--border); 
            background: rgba(255,255,255,0.05); color: var(--text); font-size: 11px; font-weight: 600; cursor: pointer;
        }
        .btn:hover { background: rgba(255,255,255,0.1); }
        .btn.active { border-color: var(--accent); color: var(--accent); }

        .link { stroke: rgba(255,255,255,0.05); stroke-width: 1.5px; fill: none; }
        .link.active-flow { stroke: var(--accent); stroke-width: 2px; stroke-opacity: 0.8; stroke-dasharray: 5,5; animation: dash 1s linear infinite; }
        @keyframes dash { to { stroke-dashoffset: -10; } }
        
        .node { stroke: var(--bg); stroke-width: 2px; cursor: pointer; transition: 0.3s; }
        .node:hover { filter: brightness(1.5); r: 10; }
        .node.pulsing { animation: pulse 2s infinite; }
        @keyframes pulse { 0% { stroke-width: 2px; } 50% { stroke-width: 8px; stroke: rgba(34,197,94,0.3); } 100% { stroke-width: 2px; } }
    </style>
</head>
<body>
    <div class="controls">
        <h1>SYNTHOS Live Map</h1>
        <div class="status-badge">
            <div class="status-dot" id="status-dot"></div>
            <span id="status-text">Local Node Offline</span>
        </div>
        <p style="font-size: 11px; color: var(--muted); margin-bottom: 12px;">Monitoring live agent transitions and reputation cycles.</p>
        
        <div class="btn-group">
            <button class="btn active" onclick="setFlow('all')">Show All</button>
            <button class="btn" onclick="setFlow('gov')">Governance</button>
            <button class="btn" onclick="setFlow('econ')">Economic</button>
        </div>
        <div class="btn-group">
            <button class="btn" onclick="setFlow('enforce')">Security</button>
            <button class="btn" onclick="setFlow('sim')">Simulator</button>
        </div>
    </div>

    <div class="node-info" id="node-info">
        <div>HEIGHT: <span id="val-height">--</span></div>
        <div>PEERS: <span id="val-peers">--</span></div>
        <div>AGENT: <span id="val-id">--</span></div>
    </div>

    <svg id="viz"></svg>

    <script>
        const manifest = {
            nodes: [
                // Protocols
                { id: "p2p-gossip", name: "P2P Gossip", group: "protocols" },
                { id: "relay", name: "Relay", group: "protocols" },
                // Contracts
                { id: "tx-logic", name: "TX Logic", group: "contracts" },
                { id: "finality", name: "Finality", group: "contracts" },
                // Agents
                { id: "sovereign-agent", name: "Sovereign Node", group: "agents" },
                { id: "light-agent", name: "Cell Agent", group: "agents" },
                // Roles
                { id: "validator", name: "Validator", group: "roles" },
                { id: "governor", name: "Governor", group: "roles" },
                { id: "economist", name: "Economist", group: "roles" },
                { id: "communicator", name: "Communicator", group: "roles" },
                { id: "simulator", name: "Simulator", group: "roles" },
                { id: "enforcer", name: "Enforcer", group: "roles" },
                { id: "citizen", name: "Citizen", group: "roles" },
                // States
                { id: "ledger", name: "Ledger", group: "states" },
                { id: "reputation", name: "Reputation", group: "states" },
                { id: "mempool", name: "Mempool", group: "states" }
            ],
            flows: {
                tx: ["citizen", "communicator", "validator", "tx-logic", "ledger"],
                gov: ["governor", "citizen", "validator", "finality"],
                econ: ["economist", "validator", "ledger", "citizen"],
                enforce: ["enforcer", "reputation", "sovereign-agent"],
                sim: ["simulator", "governor", "economist"]
            }
        };

        const colors = {
            protocols: "#3b82f6",
            contracts: "#ef4444",
            agents: "#a855f7",
            roles: "#22c55e",
            states: "#f59e0b"
        };

        const svg = d3.select("#viz");
        const width = window.innerWidth;
        const height = window.innerHeight;

        // Generate Links from Flows
        const links = [];
        Object.values(manifest.flows).forEach(path => {
            for(let i=0; i<path.length-1; i++) {
                links.push({ source: path[i], target: path[i+1], flow: Object.keys(manifest.flows).find(k => manifest.flows[k] === path) });
            }
        });

        const simulation = d3.forceSimulation(manifest.nodes)
            .force("link", d3.forceLink(links).id(d => d.id).distance(120))
            .force("charge", d3.forceManyBody().strength(-400))
            .force("center", d3.forceCenter(width / 2, height / 2))
            .force("collision", d3.forceCollide().radius(40));

        const link = svg.append("g")
            .selectAll("line")
            .data(links)
            .join("line")
            .attr("class", "link");

        const node = svg.append("g")
            .selectAll("circle")
            .data(manifest.nodes)
            .join("circle")
            .attr("class", "node")
            .attr("r", 7)
            .attr("fill", d => colors[d.group])
            .call(d3.drag()
                .on("start", dragstarted)
                .on("drag", dragged)
                .on("end", dragended));

        const label = svg.append("g")
            .selectAll("text")
            .data(manifest.nodes)
            .join("text")
            .attr("style", "font-size: 10px; font-weight: 600; pointer-events: none; fill: #94a3b8;")
            .attr("dx", 12)
            .attr("dy", 4)
            .text(d => d.name);

        simulation.on("tick", () => {
            link.attr("x1", d => d.source.x).attr("y1", d => d.source.y)
                .attr("x2", d => d.target.x).attr("y2", d => d.target.y);
            node.attr("cx", d => d.x).attr("cy", d => d.y);
            label.attr("x", d => d.x).attr("y", d => d.y);
        });

        function setFlow(flowId) {
            document.querySelectorAll('.btn').forEach(b => b.classList.remove('active'));
            link.attr("class", "link");
            if(flowId === 'all') return;
            link.filter(d => d.flow === flowId).attr("class", "link active-flow");
        }

        // --- Live Data Bridge ---
        async function sync() {
            try {
                const resp = await fetch("http://localhost:8080/status");
                if(resp.ok) {
                    const data = await resp.json();
                    document.getElementById('status-dot').classList.add('online');
                    document.getElementById('status-text').textContent = "Local Node Online";
                    document.getElementById('val-height').textContent = data.height;
                    document.getElementById('val-id').textContent = data.agent_id ? data.agent_id.substr(0,12) : '--';
                    
                    // Pulse the Sovereign Agent Node
                    node.filter(d => d.id === 'sovereign-agent').classed('pulsing', true);
                }
            } catch(e) {
                document.getElementById('status-dot').classList.remove('online');
                document.getElementById('status-text').textContent = "Local Node Offline";
                node.classed('pulsing', false);
            }
        }
        setInterval(sync, 3000);
        sync();

        // Drag handlers
        function dragstarted(event) { if (!event.active) simulation.alphaTarget(0.3).restart(); event.subject.fx = event.subject.x; event.subject.fy = event.subject.y; }
        function dragged(event) { event.subject.fx = event.x; event.subject.fy = event.y; }
        function dragended(event) { if (!event.active) simulation.alphaTarget(0); event.subject.fx = null; event.subject.fy = null; }
    </script>
</body>
</html>
