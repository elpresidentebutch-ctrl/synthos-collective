services:
  - type: web
    name: synthos-rpc
    runtime: docker
    dockerfilePath: ./Dockerfile
    dockerCommand: /usr/local/bin/synthosd
    healthCheckPath: /health
    autoDeploy: true
    envVars:
      - key: SYNTHOS_CONFIG
        value: /config/render-node.json
      - key: SYNTHOS_DATA_DIR
        value: /data
      - key: SYNTHOS_BOOTSTRAP_IMMUNE_NODE
        value: "true"
      # Real multi-party consensus: this node (synthos-render-validator-1)
      # is one of the 3 validators that independently validate and vote on
      # every block the sequencer (synthos-validator-12) proposes -- see
      # config/render-node.json's validators/trusted_validators/peer_keys.
      # It never initiates a round itself (no SYNTHOS_CONSENSUS_PEERS here),
      # only answers /consensus/propose requests and enforces the real
      # 2-of-3 quorum on any block it accepts. Must be set to the exact
      # same value as SYNTHOS_CONSENSUS_TOKEN on synthos-validator-12 and
      # synthos-validator-13 -- set it once in the Render dashboard (it's
      # sync: false so it isn't committed here).
      - key: SYNTHOS_CONSENSUS_TOKEN
        sync: false
    disk:
      name: synthos-rpc-data
      mountPath: /data
      sizeGB: 1

  - type: web
    name: synthos-validator-11
    runtime: docker
    dockerfilePath: ./Dockerfile
    dockerCommand: /usr/local/bin/synthosd
    healthCheckPath: /health
    autoDeploy: true
    envVars:
      - key: SYNTHOS_CONFIG
        value: /config/render-validator-11.json
      - key: SYNTHOS_DATA_DIR
        value: /data
      - key: SYNTHOS_NODE_ID
        value: synthos-validator-11
      - key: SYNTHOS_SELF_URL
        value: https://synthos-validator-11.onrender.com
      - key: SYNTHOS_REGISTRY_URL
        value: https://synthos-www.onrender.com
      - key: SYNTHOS_BOOTSTRAP_IMMUNE_NODE
        value: "true"
      - key: SYNTHOS_PRIVATE_KEY
        sync: false
    disk:
      name: synthos-validator-11-data
      mountPath: /data
      sizeGB: 1

  - type: web
    name: synthos-validator-12
    runtime: docker
    dockerfilePath: ./Dockerfile
    dockerCommand: /usr/local/bin/synthosd
    healthCheckPath: /health
    autoDeploy: true
    envVars:
      - key: SYNTHOS_CONFIG
        value: /config/render-validator-12.json
      - key: SYNTHOS_DATA_DIR
        value: /data
      - key: SYNTHOS_NODE_ID
        value: synthos-validator-12
      - key: SYNTHOS_SELF_URL
        value: https://synthos-validator-12.onrender.com
      - key: SYNTHOS_REGISTRY_URL
        value: https://synthos-www.onrender.com
      - key: SYNTHOS_BOOTSTRAP_IMMUNE_NODE
        value: "true"
      # Single designated sequencer: only this validator auto-produces blocks.
      # The other validators (11, 13-15) follow via HTTP peer catch-up.
      # Enabling the producer LOOP on more than one node would still fork the
      # chain -- that part is unchanged. What changed: this node no longer
      # just self-approves every block it proposes. With SYNTHOS_CONSENSUS_
      # PEERS + SYNTHOS_CONSENSUS_TOKEN set, it asks synthos-validator-13 and
      # synthos-render-validator-1 to independently validate and vote on
      # each proposal over HTTPS, and only finalizes once a real 2-of-3
      # quorum of genuine signatures is collected -- see rpc.Server.
      # ProposeBlockWithConsensus. If quorum isn't reached in time, this
      # node simply retries at the next tick rather than finalizing alone.
      - key: SYNTHOS_BLOCK_PRODUCER
        value: "true"
      - key: SYNTHOS_BLOCK_INTERVAL_SECONDS
        value: "10"
      - key: SYNTHOS_PRODUCE_EMPTY_BLOCKS
        value: "true"
      - key: SYNTHOS_CONSENSUS_PEERS
        value: https://synthos-validator-13.onrender.com,https://synthos-rpc.onrender.com
      # Must be set to the exact same value as SYNTHOS_CONSENSUS_TOKEN on
      # synthos-validator-13 and synthos-rpc -- set it once in the Render
      # dashboard (it's sync: false so it isn't committed here).
      - key: SYNTHOS_CONSENSUS_TOKEN
        sync: false
      - key: SYNTHOS_PRIVATE_KEY
        sync: false
    disk:
      name: synthos-validator-12-data
      mountPath: /data
      sizeGB: 1

  - type: web
    name: synthos-validator-13
    runtime: docker
    dockerfilePath: ./Dockerfile
    dockerCommand: /usr/local/bin/synthosd
    healthCheckPath: /health
    autoDeploy: true
    envVars:
      - key: SYNTHOS_CONFIG
        value: /config/render-validator-13.json
      - key: SYNTHOS_DATA_DIR
        value: /data
      - key: SYNTHOS_NODE_ID
        value: synthos-validator-13
      - key: SYNTHOS_SELF_URL
        value: https://synthos-validator-13.onrender.com
      - key: SYNTHOS_REGISTRY_URL
        value: https://synthos-www.onrender.com
      - key: SYNTHOS_BOOTSTRAP_IMMUNE_NODE
        value: "true"
      # Real multi-party consensus: this node independently validates and
      # votes on every block synthos-validator-12 proposes -- see
      # config/render-validator-13.json. It never initiates a round itself
      # (no SYNTHOS_CONSENSUS_PEERS here), only answers /consensus/propose
      # requests and enforces the real 2-of-3 quorum on any block it
      # accepts. Must be set to the exact same value as
      # SYNTHOS_CONSENSUS_TOKEN on synthos-validator-12 and synthos-rpc --
      # set it once in the Render dashboard (it's sync: false so it isn't
      # committed here).
      - key: SYNTHOS_CONSENSUS_TOKEN
        sync: false
      - key: SYNTHOS_PRIVATE_KEY
        sync: false
    disk:
      name: synthos-validator-13-data
      mountPath: /data
      sizeGB: 1

  - type: web
    name: synthos-validator-14
    runtime: docker
    dockerfilePath: ./Dockerfile
    dockerCommand: /usr/local/bin/synthosd
    healthCheckPath: /health
    autoDeploy: true
    envVars:
      - key: SYNTHOS_CONFIG
        value: /config/render-validator-14.json
      - key: SYNTHOS_DATA_DIR
        value: /data
      - key: SYNTHOS_NODE_ID
        value: synthos-validator-14
      - key: SYNTHOS_SELF_URL
        value: https://synthos-validator-14.onrender.com
      - key: SYNTHOS_REGISTRY_URL
        value: https://synthos-www.onrender.com
      - key: SYNTHOS_BOOTSTRAP_IMMUNE_NODE
        value: "true"
      - key: SYNTHOS_PRIVATE_KEY
        sync: false
    disk:
      name: synthos-validator-14-data
      mountPath: /data
      sizeGB: 1

  - type: web
    name: synthos-validator-15
    runtime: docker
    dockerfilePath: ./Dockerfile
    dockerCommand: /usr/local/bin/synthosd
    healthCheckPath: /health
    autoDeploy: true
    envVars:
      - key: SYNTHOS_CONFIG
        value: /config/render-validator-15.json
      - key: SYNTHOS_DATA_DIR
        value: /data
      - key: SYNTHOS_NODE_ID
        value: synthos-validator-15
      - key: SYNTHOS_SELF_URL
        value: https://synthos-validator-15.onrender.com
      - key: SYNTHOS_REGISTRY_URL
        value: https://synthos-www.onrender.com
      - key: SYNTHOS_BOOTSTRAP_IMMUNE_NODE
        value: "true"
      - key: SYNTHOS_PRIVATE_KEY
        sync: false
    disk:
      name: synthos-validator-15-data
      mountPath: /data
      sizeGB: 1

  - type: web
    name: synthos-www
    runtime: docker
    dockerfilePath: ./Dockerfile
    dockerCommand: /usr/local/bin/cloudless-registry -state /data/cloudless-registry.json
    healthCheckPath: /health
    autoDeploy: true
    envVars:
      - key: SYNTHOS_NATIVE_RPC_URL
        value: https://synthos-rpc.onrender.com
      - key: SYNTHOS_DISTRIBUTION_AGENT_ID
        value: synthos-early-adopter-distributor
      - key: SYNTHOS_EARLY_ACCESS_TREASURY_WALLET
        value: 0x5d6f8FbAAB199E788ed9Cfcb3F7Fe2ac9c0450d2
      - key: SYNTHOS_EARLY_ACCESS_PAYMENT_TREASURY
        value: 0x5d6f8FbAAB199E788ed9Cfcb3F7Fe2ac9c0450d2
      - key: SYNTHOS_EARLY_ACCESS_CHAIN_ID
        value: "20260702"
      - key: SYNTHOS_EARLY_ACCESS_TX_CHAIN_ID
        value: "20260702"
      - key: SYNTHOS_EARLY_ACCESS_CHAIN_NAME
        value: synthos-mainnet-1
      - key: SYNTHOS_EARLY_ACCESS_RPC_URLS
        value: https://synthos-rpc.onrender.com,https://synthos-validator-12.onrender.com,https://synthos-validator-13.onrender.com
      - key: SYNTHOS_CORS_ORIGINS
        value: https://www.ishamwilliamsblockchains.com,https://ishamwilliamsblockchains.com,https://lovable.dev
      - key: SYNTHOS_EARLY_ACCESS_WIDGET_PATH
        value: /website/assets/early-access-sale.js
      - key: SYNTHOS_DISTRIBUTION_AGENT_PRIVATE_KEY
        sync: false
      - key: SYNTHOS_EARLY_ACCESS_ALLOCATION_PRIVATE_KEY
        sync: false
      - key: SYNTHOS_EARLY_ACCESS_ASSETS_JSON
        sync: false
    disk:
      name: synthos-www-data
      mountPath: /data
      sizeGB: 1
