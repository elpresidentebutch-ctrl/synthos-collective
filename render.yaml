  - type: web
    name: synthos-www
    runtime: docker
    dockerfilePath: ./Dockerfile
    dockerCommand: /usr/local/bin/cloudless-registry -state /data/cloudless-registry.json
    healthCheckPath: /health
    autoDeploy: true
    envVars:
      - key: SYNTHOS_NATIVE_RPC_URL
        value: https://synthos-validator-11.onrender.com
      - key: SYNTHOS_DISTRIBUTION_AGENT_ID
        value: synthos-early-adopter-distributor
      - key: SYNTHOS_EARLY_ACCESS_TREASURY_WALLET
        value: 0x5d6f8FbAAB199E788ed9Cfcb3F7Fe2ac9c0450d2
      - key: SYNTHOS_EARLY_ACCESS_PAYMENT_TREASURY
        value: 0x5d6f8FbAAB199E788ed9Cfcb3F7Fe2ac9c0450d2
      - key: SYNTHOS_EARLY_ACCESS_CHAIN_ID
        value: "20260702"
      - key: SYNTHOS_EARLY_ACCESS_TX_CHAIN_ID
        value: "20260702"
      - key: SYNTHOS_EARLY_ACCESS_CHAIN_NAME
        value: synthos-mainnet-1
      - key: SYNTHOS_EARLY_ACCESS_RPC_URLS
        value: https://synthos-validator-11.onrender.com,https://synthos-validator-12.onrender.com,https://synthos-validator-13.onrender.com,https://synthos-validator-14.onrender.com,https://synthos-validator-15.onrender.com
      - key: SYNTHOS_CORS_ORIGINS
        value: https://www.ishamwilliamsblockchains.com,https://ishamwilliamsblockchains.com,https://lovable.dev
      - key: SYNTHOS_EARLY_ACCESS_WIDGET_PATH
        value: /website/assets/early-access-sale.js
      - key: SYNTHOS_DISTRIBUTION_AGENT_PRIVATE_KEY
        sync: false
      - key: SYNTHOS_EARLY_ACCESS_ALLOCATION_PRIVATE_KEY
        sync: false
      - key: SYNTHOS_EARLY_ACCESS_ASSETS_JSON
        sync: false
    disk:
      name: synthos-www-data
      mountPath: /data
      sizeGB: 1
