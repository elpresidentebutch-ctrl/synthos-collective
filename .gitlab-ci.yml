stages:
  - test
  - build
  - deploy
  - release-build
  - release-package
  - release-publish

variables:
  GOFLAGS: "-mod=mod"
  DOCKER_TLS_CERTDIR: "/certs"
  CGO_ENABLED: "0"
  PACKAGE_REGISTRY_URL: "${CI_API_V4_URL}/projects/${CI_PROJECT_ID}/packages/generic/synthos-node/${CI_COMMIT_TAG}"

go-test:
  stage: test
  image: golang:1.26
  script:
    - go test -count=1 ./...

solidity-test:
  stage: test
  image: node:20-bookworm
  cache:
    key:
      files:
        - contracts/package-lock.json
    paths:
      - contracts/.npm/
  before_script:
    - cd contracts
    - npm ci --legacy-peer-deps --cache .npm --prefer-offline
  script:
    - npm run compile
    - npm test

docker-build:
  stage: build
  image: docker:27
  services:
    - docker:27-dind
  script:
    - docker build -t synthos-collective:$CI_COMMIT_SHORT_SHA .

android-apk-build:
  stage: build
  image: ghcr.io/cirruslabs/android-sdk:34
  needs: []
  script:
    - apt-get update -y && apt-get install -y wget unzip
    - wget -q https://services.gradle.org/distributions/gradle-8.4-bin.zip
    - unzip -q gradle-8.4-bin.zip
    - export PATH=$PWD/gradle-8.4/bin:$PATH
    - cd android
    - |
      if [ -z "$ANDROID_KEYSTORE_BASE64" ]; then
        echo "ERROR: ANDROID_KEYSTORE_BASE64 secret is not configured in GitLab CI/CD Variables."
        echo "A persistent release keystore is required to build signed, updateable release APKs."
        exit 1
      fi
      echo "$ANDROID_KEYSTORE_BASE64" | base64 -d > app/release.keystore
      export ANDROID_KEYSTORE_FILE=release.keystore
    - gradle assembleRelease --stacktrace
    - mkdir -p ../dist
    - |
      if [ ! -f app/build/outputs/apk/release/app-release.apk ]; then
        echo "ERROR: Release APK was not generated at expected path."
        exit 1
      fi
      cp app/build/outputs/apk/release/app-release.apk ../dist/synthos-node.apk
  artifacts:
    name: synthos-node-apk
    paths:
      - dist/synthos-node.apk
    expire_in: 30 days
  rules:
    - if: '$CI_COMMIT_BRANCH == "main"'
    - if: '$CI_COMMIT_TAG'

render-deploy:
  stage: deploy
  image: curlimages/curl:8.10.1
  rules:
    - if: '$RENDER_DEPLOY_HOOK_URL'
      when: manual
    - when: never
  script:
    - curl --fail --request POST "$RENDER_DEPLOY_HOOK_URL"

# ---------------------------------------------------------------------------
# Production CometBFT Node: dependency bundle & tests
# ---------------------------------------------------------------------------
cometapp-deps:
  stage: build
  image: golang:1.26
  rules:
    - if: '$CI_COMMIT_BRANCH == "main" || $CI_COMMIT_BRANCH == "master"'
    - if: '$CI_COMMIT_BRANCH =~ /^feat\/cometbft/'
    - if: '$CI_COMMIT_TAG'
  script:
    - cd cometapp
    - go mod tidy
    - go mod vendor
    - go build ./...
    - go list -m all > modules.txt
    - go version > go-version.txt
    - cd ..
    - tar czf cometapp-deps.tgz cometapp/go.mod cometapp/go.sum cometapp/vendor cometapp/modules.txt cometapp/go-version.txt
    - ls -la cometapp-deps.tgz
  artifacts:
    paths:
      - cometapp-deps.tgz
    expire_in: 14 days

# Tests for the production CometBFT-based node (cometapp/): application against
# ABCI calls, plus real in-process CometBFT networks (single node with restart,
# and 5-node network with validator bonding/unbonding and failover).
cometapp-test:
  stage: test
  image: golang:1.26
  variables:
    CGO_ENABLED: "1" # the race detector needs cgo; the pipeline default is 0
  rules:
    - if: '$CI_COMMIT_BRANCH == "main" || $CI_COMMIT_BRANCH == "master"'
    - if: '$CI_COMMIT_TAG'
    - if: '$CI_COMMIT_BRANCH =~ /^feat\/cometbft/'
    - changes:
        - cometapp/**/*
        - internal/chain/**/*
        - .gitlab-ci.yml
  script:
    - cd cometapp
    - go vet ./...
    - go test -race -count=1 -timeout 600s ./...

# ---------------------------------------------------------------------------
# Node binary releases
#
# Builds real, auditable cross-platform binaries straight from this repo's
# source and publishes them as a GitLab Release.
#
# Three binaries are published:
#   - synthos-node-<os>-<arch>[.exe]   built from cmd/silentnode: the
#     outbound-only Proof-of-Uptime candidate client (no open ports, no
#     consensus participation).
#   - synthos-comet-<os>-<arch>[.exe]  built from cometapp: the production
#     CometBFT validator/consensus binary (live chain since Oct 22, 2026).
#   - synthosd-<os>-<arch>[.exe]       built from cmd/synthosd: the legacy
#     pre-CometBFT standalone node engine, kept for archive and migration reference.
#
# Triggers:
#   - Pushing a tag like v1.2.3 builds the binaries AND publishes a real
#     GitLab Release with them attached.
#   - A manual "Run pipeline" (CI/CD > Pipelines > Run pipeline, no tag)
#     builds the same artifacts without publishing, so the build can be
#     sanity-checked before cutting a real tag.
# ---------------------------------------------------------------------------

.release_build_template:
  stage: release-build
  image: golang:1.26
  script:
    - mkdir -p dist
    - GOOS=$GOOS GOARCH=$GOARCH go build -trimpath -ldflags="-s -w" -o "dist/synthos-node-${GOOS}-${GOARCH}${EXT}" ./cmd/silentnode
    - (cd cometapp && GOOS=$GOOS GOARCH=$GOARCH go build -trimpath -ldflags="-s -w" -o "../dist/synthos-comet-${GOOS}-${GOARCH}${EXT}" .)
    - GOOS=$GOOS GOARCH=$GOARCH go build -trimpath -ldflags="-s -w" -o "dist/synthosd-${GOOS}-${GOARCH}${EXT}" ./cmd/synthosd
    - echo "built dist/synthos-node-${GOOS}-${GOARCH}${EXT}, dist/synthos-comet-${GOOS}-${GOARCH}${EXT}, and dist/synthosd-${GOOS}-${GOARCH}${EXT}"
  artifacts:
    paths:
      - dist/
    expire_in: 14 days
  rules:
    - if: '$CI_COMMIT_TAG'
    - if: '$CI_PIPELINE_SOURCE == "web"'

release-build:linux-amd64:
  extends: .release_build_template
  variables:
    GOOS: linux
    GOARCH: amd64
    EXT: ""

release-build:linux-arm64:
  extends: .release_build_template
  variables:
    GOOS: linux
    GOARCH: arm64
    EXT: ""

release-build:darwin-arm64:
  extends: .release_build_template
  variables:
    GOOS: darwin
    GOARCH: arm64
    EXT: ""

release-build:darwin-amd64:
  extends: .release_build_template
  variables:
    GOOS: darwin
    GOARCH: amd64
    EXT: ""

release-build:windows-amd64:
  extends: .release_build_template
  variables:
    GOOS: windows
    GOARCH: amd64
    EXT: ".exe"

release-checksums:
  stage: release-package
  image: alpine:3.19
  needs:
    - release-build:linux-amd64
    - release-build:linux-arm64
    - release-build:darwin-arm64
    - release-build:darwin-amd64
    - release-build:windows-amd64
  script:
    - cd dist && sha256sum * > SHA256SUMS && cat SHA256SUMS
  artifacts:
    paths:
      - dist/
    expire_in: 14 days
  rules:
    - if: '$CI_COMMIT_TAG'
    - if: '$CI_PIPELINE_SOURCE == "web"'

# Only tagged pipelines go further than this: uploading requires a real
# CI_COMMIT_TAG to namespace the generic package, and a manual/web build
# has none, so it stops after release-checksums above (which is enough to
# sanity check the build before cutting a real tag).

release-upload:
  stage: release-package
  image: curlimages/curl:8.8.0
  needs:
    - release-checksums
  script:
    - |
      for f in dist/*; do
        name="$(basename "$f")"
        echo "uploading $name"
        curl --fail --header "JOB-TOKEN: ${CI_JOB_TOKEN}" --upload-file "$f" "${PACKAGE_REGISTRY_URL}/${name}"
      done
  rules:
    - if: '$CI_COMMIT_TAG'

release-publish:
  stage: release-publish
  image: registry.gitlab.com/gitlab-org/release-cli:latest
  needs:
    - release-upload
  script:
    - echo "Publishing release ${CI_COMMIT_TAG}"
  release:
    tag_name: '$CI_COMMIT_TAG'
    description: 'SYNTHOS node binaries for $CI_COMMIT_TAG'
    assets:
      links:
        - name: "synthos-node-linux-amd64"
          url: "${PACKAGE_REGISTRY_URL}/synthos-node-linux-amd64"
        - name: "synthos-node-darwin-arm64"
          url: "${PACKAGE_REGISTRY_URL}/synthos-node-darwin-arm64"
        - name: "synthos-node-darwin-amd64"
          url: "${PACKAGE_REGISTRY_URL}/synthos-node-darwin-amd64"
        - name: "synthos-node-windows-amd64.exe"
          url: "${PACKAGE_REGISTRY_URL}/synthos-node-windows-amd64.exe"
        - name: "synthos-comet-linux-amd64"
          url: "${PACKAGE_REGISTRY_URL}/synthos-comet-linux-amd64"
        - name: "synthos-comet-darwin-arm64"
          url: "${PACKAGE_REGISTRY_URL}/synthos-comet-darwin-arm64"
        - name: "synthos-comet-darwin-amd64"
          url: "${PACKAGE_REGISTRY_URL}/synthos-comet-darwin-amd64"
        - name: "synthos-comet-windows-amd64.exe"
          url: "${PACKAGE_REGISTRY_URL}/synthos-comet-windows-amd64.exe"
        - name: "synthosd-linux-amd64"
          url: "${PACKAGE_REGISTRY_URL}/synthosd-linux-amd64"
        - name: "synthosd-darwin-arm64"
          url: "${PACKAGE_REGISTRY_URL}/synthosd-darwin-arm64"
        - name: "synthosd-darwin-amd64"
          url: "${PACKAGE_REGISTRY_URL}/synthosd-darwin-amd64"
        - name: "synthosd-windows-amd64.exe"
          url: "${PACKAGE_REGISTRY_URL}/synthosd-windows-amd64.exe"
        - name: "SHA256SUMS"
          url: "${PACKAGE_REGISTRY_URL}/SHA256SUMS"
  rules:
    - if: '$CI_COMMIT_TAG'

# ---------------------------------------------------------------------------
# GitLab Cloud Watchdog Nodes
#
# Runs real Ed25519 silent nodes directly from GitLab's shared cloud runners.
# Reports verified signed heartbeats to the live registry.
# ---------------------------------------------------------------------------
gitlab-cloud-nodes:
  stage: test
  image: golang:1.26-alpine
  rules:
    - if: '$CI_PIPELINE_SOURCE == "schedule"'
    - if: '$CI_PIPELINE_SOURCE == "web"'
    - if: '$CI_COMMIT_BRANCH == "main"'
  script:
    - apk add --no-cache ca-certificates
    - go build -o /tmp/silentnode ./cmd/silentnode
    - /tmp/silentnode -id "syn-gitlab-cloud-1" -relay "https://synthos-www.onrender.com" &
    - PID1=$!
    - /tmp/silentnode -id "syn-gitlab-cloud-2" -relay "https://synthos-www.onrender.com" &
    - PID2=$!
    - echo "GitLab cloud nodes (syn-gitlab-cloud-1, syn-gitlab-cloud-2) are actively proving from GitLab runners..."
    - sleep 180
    - kill $PID1 $PID2 || true
