stages:
  - test
  - build
  - deploy
  - release-build
  - release-package
  - release-publish

variables:
  GOFLAGS: "-mod=mod"
  DOCKER_TLS_CERTDIR: "/certs"
  CGO_ENABLED: "0"
  PACKAGE_REGISTRY_URL: "${CI_API_V4_URL}/projects/${CI_PROJECT_ID}/packages/generic/synthos-node/${CI_COMMIT_TAG}"

go-test:
  stage: test
  image: golang:1.25
  script:
    - go test -count=1 ./...

solidity-test:
  stage: test
  image: node:20-bookworm
  cache:
    key:
      files:
        - contracts/package-lock.json
    paths:
      - contracts/.npm/
  before_script:
    - cd contracts
    - npm ci --legacy-peer-deps --cache .npm --prefer-offline
  script:
    - npm run compile
    - npm test

docker-build:
  stage: build
  image: docker:27
  services:
    - docker:27-dind
  script:
    - docker build -t synthos-collective:$CI_COMMIT_SHORT_SHA .

render-deploy:
  stage: deploy
  image: curlimages/curl:8.10.1
  rules:
    - if: '$RENDER_DEPLOY_HOOK_URL'
      when: manual
    - when: never
  script:
    - curl --fail --request POST "$RENDER_DEPLOY_HOOK_URL"

# ---------------------------------------------------------------------------
# Node binary releases
#
# Builds real, auditable cross-platform binaries straight from this repo's
# source and publishes them as a GitLab Release, so anyone downloading a
# SYNTHOS node binary can trace it back to the exact commit that built it --
# rather than depending on some separate, unaudited build process.
#
# This is the GitLab-native equivalent of .github/workflows/release.yml,
# added because GitHub Actions on this account is currently blocked by a
# billing lock. Same two binaries, same meaning:
#   - synthos-node-<os>-<arch>[.exe]   built from cmd/silentnode: the
#     outbound-only Proof-of-Uptime candidate client (no open ports, no
#     consensus participation). This is what the public "run a node"
#     download should point at for someone just getting started.
#   - synthosd-<os>-<arch>[.exe]       built from cmd/synthosd: the real
#     validator/consensus binary. Running this does not by itself make
#     anyone an active validator -- joining the live validator set is
#     still a separate, deliberate operator step (shared genesis, peer
#     registration, consensus tokens), not something this pipeline grants.
#
# Triggers:
#   - Pushing a tag like v1.2.3 builds the binaries AND publishes a real
#     GitLab Release with them attached.
#   - A manual "Run pipeline" (CI/CD > Pipelines > Run pipeline, no tag)
#     builds the same artifacts without publishing, so the build can be
#     sanity-checked before cutting a real tag.
# ---------------------------------------------------------------------------

.release_build_template:
  stage: release-build
  image: golang:1.25
  script:
    - mkdir -p dist
    - GOOS=$GOOS GOARCH=$GOARCH go build -trimpath -ldflags="-s -w" -o "dist/synthos-node-${GOOS}-${GOARCH}${EXT}" ./cmd/silentnode
    - GOOS=$GOOS GOARCH=$GOARCH go build -trimpath -ldflags="-s -w" -o "dist/synthosd-${GOOS}-${GOARCH}${EXT}" ./cmd/synthosd
    - echo "built dist/synthos-node-${GOOS}-${GOARCH}${EXT} and dist/synthosd-${GOOS}-${GOARCH}${EXT}"
  artifacts:
    paths:
      - dist/
    expire_in: 14 days
  rules:
    - if: '$CI_COMMIT_TAG'
    - if: '$CI_PIPELINE_SOURCE == "web"'

release-build:linux-amd64:
  extends: .release_build_template
  variables:
    GOOS: linux
    GOARCH: amd64
    EXT: ""

release-build:darwin-arm64:
  extends: .release_build_template
  variables:
    GOOS: darwin
    GOARCH: arm64
    EXT: ""

release-build:darwin-amd64:
  extends: .release_build_template
  variables:
    GOOS: darwin
    GOARCH: amd64
    EXT: ""

release-build:windows-amd64:
  extends: .release_build_template
  variables:
    GOOS: windows
    GOARCH: amd64
    EXT: ".exe"

release-checksums:
  stage: release-package
  image: alpine:3.19
  needs:
    - release-build:linux-amd64
    - release-build:darwin-arm64
    - release-build:darwin-amd64
    - release-build:windows-amd64
  script:
    - cd dist && sha256sum * > SHA256SUMS && cat SHA256SUMS
  artifacts:
    paths:
      - dist/
    expire_in: 14 days
  rules:
    - if: '$CI_COMMIT_TAG'
    - if: '$CI_PIPELINE_SOURCE == "web"'

# Only tagged pipelines go further than this: uploading requires a real
# CI_COMMIT_TAG to namespace the generic package, and a manual/web build
# has none, so it stops after release-checksums above (which is enough to
# sanity check the build before cutting a real tag).

release-upload:
  stage: release-package
  image: curlimages/curl:8.8.0
  needs:
    - release-checksums
  script:
    - |
      for f in dist/*; do
        name="$(basename "$f")"
        echo "uploading $name"
        curl --fail --header "JOB-TOKEN: ${CI_JOB_TOKEN}" --upload-file "$f" "${PACKAGE_REGISTRY_URL}/${name}"
      done
  rules:
    - if: '$CI_COMMIT_TAG'

release-publish:
  stage: release-publish
  image: registry.gitlab.com/gitlab-org/release-cli:latest
  needs:
    - release-upload
  script:
    - echo "Publishing release ${CI_COMMIT_TAG}"
  release:
    tag_name: '$CI_COMMIT_TAG'
    description: 'SYNTHOS node binaries for $CI_COMMIT_TAG'
    assets:
      links:
        - name: "synthos-node-linux-amd64"
          url: "${PACKAGE_REGISTRY_URL}/synthos-node-linux-amd64"
        - name: "synthos-node-darwin-arm64"
          url: "${PACKAGE_REGISTRY_URL}/synthos-node-darwin-arm64"
        - name: "synthos-node-darwin-amd64"
          url: "${PACKAGE_REGISTRY_URL}/synthos-node-darwin-amd64"
        - name: "synthos-node-windows-amd64.exe"
          url: "${PACKAGE_REGISTRY_URL}/synthos-node-windows-amd64.exe"
        - name: "synthosd-linux-amd64"
          url: "${PACKAGE_REGISTRY_URL}/synthosd-linux-amd64"
        - name: "synthosd-darwin-arm64"
          url: "${PACKAGE_REGISTRY_URL}/synthosd-darwin-arm64"
        - name: "synthosd-darwin-amd64"
          url: "${PACKAGE_REGISTRY_URL}/synthosd-darwin-amd64"
        - name: "synthosd-windows-amd64.exe"
          url: "${PACKAGE_REGISTRY_URL}/synthosd-windows-amd64.exe"
        - name: "SHA256SUMS"
          url: "${PACKAGE_REGISTRY_URL}/SHA256SUMS"
  rules:
    - if: '$CI_COMMIT_TAG'
