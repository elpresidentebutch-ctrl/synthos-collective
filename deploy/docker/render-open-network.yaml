services:
  - type: web
    name: synthos-rpc
    runtime: docker
    dockerfilePath: ./Dockerfile
    dockerCommand: /usr/local/bin/synthosd
    envVars:
      - key: SYNTHOS_CONFIG
        value: /config/validator-1.json
    disk:
      name: synthos-rpc-data
      mountPath: /data
      sizeGB: 1
    healthCheckPath: /health
