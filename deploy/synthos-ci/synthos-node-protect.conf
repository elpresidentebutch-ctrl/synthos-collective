[Service]
# Validator Priority & OOM Protection Override for synthos-node (CometBFT)
# Location: /etc/systemd/system/synthos-node.service.d/override.conf

# 1. Higher CPU and I/O scheduling priority so synthos-comet gets the machine first
Nice=-5
CPUWeight=1000
IOWeight=1000

# 2. Kernel OOM protection: -900 ensures synthos-comet is heavily shielded from
# being killed by the Linux Out-Of-Memory killer under memory pressure.
OOMScoreAdjust=-900
