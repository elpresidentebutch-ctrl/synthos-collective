# Fly.io deployment for Synthos validator nodes.
# fly launch --no-deploy  (first time — creates app)
# fly deploy              (deploys)

app = "synthos-validator"
primary_region = "iad"

[build]
  dockerfile = "../../Dockerfile"

[env]
  SYNTHOS_DATA_DIR = "/data"

[http_service]
  internal_port = 8080
  force_https = true
  auto_stop_machines = false
  auto_start_machines = true
  min_machines_running = 1

[mounts]
  source = "synthos_data"
  destination = "/data"

[[vm]]
  size = "shared-cpu-1x"
  memory = "256mb"
