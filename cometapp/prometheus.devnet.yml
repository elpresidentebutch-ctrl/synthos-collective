global:
  scrape_interval: 5s
  evaluation_interval: 5s

scrape_configs:
  - job_name: 'synthos-comet-cluster'
    static_configs:
      - targets:
          - 'validator1:8080'
          - 'validator2:8081'
          - 'validator3:8082'
          - 'validator4:8083'
        labels:
          network: 'synthos-devnet'
          cluster: '4node-bft'
