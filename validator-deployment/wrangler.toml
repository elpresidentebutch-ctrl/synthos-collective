name = "synthos-validator"
main = "src/index.js"
account_id = "f2e9e2935f6f8231889b7535a9cd4b18"
compatibility_date = "2024-01-01"
compatibility_flags = ["nodejs_compat"]

# Environment 1
[env.validator1]
name = "synthos-validator-1"
vars = { VALIDATOR_ID = "validator-1", NETWORK = "mainnet" }

[[env.validator1.r2_buckets]]
binding = "VALIDATOR_BUCKET"
bucket_name = "synthos-validators"

