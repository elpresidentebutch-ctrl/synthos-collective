name: Security Checks

on:
  push:
    branches: [ main, develop ]
  pull_request:
    branches: [ main, develop ]

permissions:
  contents: read

jobs:
  go-security:
    runs-on: ubuntu-latest
    steps:
      - uses: actions/checkout@v4
        with:
          fetch-depth: 0
      
      - uses: actions/setup-go@v5
        with:
          go-version-file: go.mod
      
      # GoSec: Pinned static security analyzer (blocks on high severity findings)
      - name: Run GoSec (Root Module)
        uses: securego/gosec@v2.22.11
        with:
          args: '-severity high -fmt json -out gosec-report.json ./...'
      
      # Go vulnerability scanner (pinned version)
      - name: Go Vulnerability Audit
        run: |
          go install golang.org/x/vuln/cmd/govulncheck@v1.1.4
          govulncheck ./...
          (cd cometapp && govulncheck ./...)
      
      # Test coverage
      - name: Run Tests with Coverage
        run: |
          go test -v -race -coverprofile=coverage.out -covermode=atomic ./...
      
      # Enforce minimum coverage
      - name: Check Coverage Threshold (15%)
        run: |
          coverage=$(go tool cover -func=coverage.out | grep total | awk '{print $3}' | sed 's/%//')
          echo "Test Coverage: ${coverage}%"
          awk "BEGIN { exit !(${coverage} >= 15) }" || {
            echo "ERROR: Coverage ${coverage}% below threshold 15%"
            exit 1
          }
      
      # Upload coverage to Codecov
      - name: Upload Coverage to Codecov
        uses: codecov/codecov-action@v4
        with:
          files: ./coverage.out
          fail_ci_if_error: false

  solidity-security:
    runs-on: ubuntu-latest
    steps:
      - uses: actions/checkout@v4

      - uses: actions/setup-python@v5
        with:
          python-version: '3.12'

      - uses: actions/setup-node@v4
        with:
          node-version: '20'
      
      # Install dependencies
      - name: Install Dependencies
        run: |
          cd contracts
          npm ci --legacy-peer-deps

      # Pinned Slither analyzer
      - name: Install Slither
        run: python -m pip install --upgrade pip "slither-analyzer==0.10.4"

      - name: Compile Contracts
        run: |
          cd contracts
          npm run compile

      - name: Test Contracts
        run: |
          cd contracts
          npm test
      
      # Slither: Solidity static analysis (fails on high severity issues)
      - name: Run Slither Analysis
        run: |
          cd contracts
          slither . --filter-paths "node_modules|artifacts|cache|test" --fail-high
      
      # NPM Audit: Dependency check (fails on critical issues)
      - name: NPM Dependency Audit
        run: |
          cd contracts
          npm audit --audit-level=critical

  linting:
    runs-on: ubuntu-latest
    steps:
      - uses: actions/checkout@v4
      
      - uses: actions/setup-go@v5
        with:
          go-version-file: go.mod
      
      # GolangCI-Lint (pinned version)
      - name: Install GolangCI-Lint
        run: go install github.com/golangci/golangci-lint/cmd/golangci-lint@v1.64.5

      - name: Run GolangCI-Lint
        run: golangci-lint run --timeout=5m

  docker-build:
    runs-on: ubuntu-latest
    steps:
      - uses: actions/checkout@v4
      
      - uses: docker/setup-buildx-action@v3
      
      - name: Build Docker Image
        uses: docker/build-push-action@v6
        with:
          context: .
          push: false
          tags: synthos:${{ github.sha }}
          cache-from: type=gha
          cache-to: type=gha,mode=max
