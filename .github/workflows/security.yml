name: Security Checks

on:
  push:
    branches: [ main, develop ]
  pull_request:
    branches: [ main, develop ]

jobs:
  go-security:
    runs-on: ubuntu-latest
    steps:
      - uses: actions/checkout@v4
        with:
          fetch-depth: 0
      
      - uses: actions/setup-go@v5
        with:
          go-version-file: go.mod
      
      # GoSec: Go static security analyzer
      - name: Run GoSec
        uses: securego/gosec@master
        with:
          args: '-no-fail -fmt json -out gosec-report.json ./...'
      
      # Nancy: Go dependency vulnerability scanner
      - name: Go Dependency Audit (Nancy)
        run: |
          go install github.com/sonatype-nexus-community/nancy@latest
          go list -json -m all | nancy sleuth --severity high --output json || echo "Vulnerabilities found, but continuing..."
      
      # Test coverage
      - name: Run Tests with Coverage
        run: |
          go test -v -race -coverprofile=coverage.out -covermode=atomic ./...
      
      # Enforce minimum coverage
      - name: Check Coverage Threshold (5%)
        run: |
          coverage=$(go tool cover -func=coverage.out | grep total | awk '{print $3}' | sed 's/%//')
          echo "Test Coverage: ${coverage}%"
          if (( $(echo "$coverage < 5" | bc -l) )); then
            echo "ERROR: Coverage ${coverage}% below threshold 5%"
            exit 1
          fi
      
      # Upload coverage to Codecov (optional)
      - name: Upload Coverage to Codecov
        uses: codecov/codecov-action@v3
        with:
          files: ./coverage.out
          fail_ci_if_error: false

  solidity-security:
    runs-on: ubuntu-latest
    steps:
      - uses: actions/checkout@v4

      - uses: actions/setup-python@v5
        with:
          python-version: '3.12'

      - uses: actions/setup-node@v4
        with:
          node-version: '20'
      
      # Install dependencies
      - name: Install Dependencies
        run: |
          cd contracts
          npm install --legacy-peer-deps

      - name: Install Slither
        run: python -m pip install --upgrade pip slither-analyzer
      
      # Slither: Solidity static analysis
      - name: Run Slither Analysis
        run: |
          cd contracts
          slither . --filter-paths "node_modules|artifacts|cache|test" || true
      
      # NPM Audit: Dependency check
      - name: NPM Dependency Audit
        run: |
          cd contracts
          npm audit --audit-level=high || true

  linting:
    runs-on: ubuntu-latest
    steps:
      - uses: actions/checkout@v4
      
      - uses: actions/setup-go@v5
        with:
          go-version-file: go.mod
      
      # GolangCI-Lint
      - name: Install GolangCI-Lint
        run: go install github.com/golangci/golangci-lint/cmd/golangci-lint@latest

      - name: Run GolangCI-Lint
        run: golangci-lint run --timeout=5m

  docker-build:
    runs-on: ubuntu-latest
    steps:
      - uses: actions/checkout@v4
      
      - uses: docker/setup-buildx-action@v3
      
      - name: Build Docker Image
        uses: docker/build-push-action@v6
        with:
          context: .
          push: false
          tags: synthos:${{ github.sha }}
          cache-from: type=gha
          cache-to: type=gha,mode=max
