name: CI

on:
  push:
    branches: [main, master, codex/repair-existing-cloudflare-validators]
  pull_request:
    branches: [main, master]

jobs:
  go:
    runs-on: ubuntu-latest
    steps:
      - uses: actions/checkout@v4
      - uses: actions/setup-go@v5
        with:
          go-version-file: go.mod
      - name: Test
        run: go test -count=1 ./...

  probe-existing-cloudflare-validators:
    runs-on: ubuntu-latest
    steps:
      - uses: actions/checkout@v4
      - name: Probe validator endpoints
        run: node scripts/probe-cloudflare-validators.mjs
