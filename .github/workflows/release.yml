name: Release node binaries

# Builds real, auditable cross-platform binaries straight from this repo's
# source and publishes them as GitHub Release assets, so anyone downloading
# a SYNTHOS node binary can trace it back to the exact commit that built it
# -- rather than depending on some separate, unaudited build process.
#
# Three binaries are published:
#   - synthos-node-<os>-<arch>[.exe]   built from cmd/silentnode: the
#     outbound-only Proof-of-Uptime candidate client (no open ports, no
#     consensus participation). This is what the public "run a node"
#     download points at for operators getting started.
#   - synthos-comet-<os>-<arch>[.exe]  built from cometapp: the production
#     CometBFT validator/consensus binary (live chain since Oct 22, 2026).
#   - synthosd-<os>-<arch>[.exe]       built from cmd/synthosd: the legacy
#     pre-CometBFT standalone node engine, kept for archive and migration reference.
#
# Triggers:
#   - Pushing a tag like v1.2.3 publishes a real GitHub Release.
#   - workflow_dispatch (manual run from the Actions tab) builds the same
#     artifacts without publishing a Release, so the build can be sanity
#     checked before cutting a real tag.

on:
  push:
    tags:
      - "v*.*.*"
  workflow_dispatch: {}

permissions:
  contents: read

jobs:
  build:
    runs-on: ubuntu-latest
    strategy:
      matrix:
        include:
          - goos: linux
            goarch: amd64
            ext: ""
          - goos: linux
            goarch: arm64
            ext: ""
          - goos: darwin
            goarch: arm64
            ext: ""
          - goos: darwin
            goarch: amd64
            ext: ""
          - goos: windows
            goarch: amd64
            ext: ".exe"
    steps:
      - uses: actions/checkout@v4

      - uses: actions/setup-go@v5
        with:
          go-version-file: go.mod
          cache: true

      - name: Build synthos-node (cmd/silentnode -- Proof-of-Uptime candidate client)
        env:
          GOOS: ${{ matrix.goos }}
          GOARCH: ${{ matrix.goarch }}
          CGO_ENABLED: "0"
        run: |
          out="dist/synthos-node-${{ matrix.goos }}-${{ matrix.goarch }}${{ matrix.ext }}"
          mkdir -p dist
          go build -trimpath -ldflags="-s -w" -o "$out" ./cmd/silentnode
          echo "built $out"

      - name: Build synthos-comet (cometapp -- production CometBFT validator node)
        env:
          GOOS: ${{ matrix.goos }}
          GOARCH: ${{ matrix.goarch }}
          CGO_ENABLED: "0"
        run: |
          out="dist/synthos-comet-${{ matrix.goos }}-${{ matrix.goarch }}${{ matrix.ext }}"
          (cd cometapp && go build -trimpath -ldflags="-s -w" -o "../$out" .)
          echo "built $out"

      - name: Build synthosd (cmd/synthosd -- legacy consensus binary)
        env:
          GOOS: ${{ matrix.goos }}
          GOARCH: ${{ matrix.goarch }}
          CGO_ENABLED: "0"
        run: |
          out="dist/synthosd-${{ matrix.goos }}-${{ matrix.goarch }}${{ matrix.ext }}"
          go build -trimpath -ldflags="-s -w" -o "$out" ./cmd/synthosd
          echo "built $out"

      - uses: actions/upload-artifact@v4
        with:
          name: dist-${{ matrix.goos }}-${{ matrix.goarch }}
          path: dist/*
          retention-days: 14

  build-android:
    runs-on: ubuntu-latest
    steps:
      - uses: actions/checkout@v4

      - name: Set up JDK 17
        uses: actions/setup-java@v4
        with:
          java-version: '17'
          distribution: 'temurin'

      - name: Setup Android SDK
        uses: android-actions/setup-android@v3

      - name: Setup Gradle
        uses: gradle/actions/setup-gradle@v3

      - name: Prepare Signing Keystore from Secrets
        id: prep-keystore
        env:
          KEYSTORE_BASE64: ${{ secrets.ANDROID_KEYSTORE_BASE64 }}
        run: |
          if [ -n "$KEYSTORE_BASE64" ]; then
            echo "$KEYSTORE_BASE64" | base64 -d > android/app/release.keystore
            echo "has_keystore=true" >> "$GITHUB_OUTPUT"
            echo "Keystore successfully configured from CI secrets."
          else
            echo "has_keystore=false" >> "$GITHUB_OUTPUT"
            echo "No ANDROID_KEYSTORE_BASE64 secret found; building un-signed release."
          fi

      - name: Build Android Release APK
        env:
          ANDROID_KEYSTORE_FILE: release.keystore
          ANDROID_KEYSTORE_PASSWORD: ${{ secrets.ANDROID_KEYSTORE_PASSWORD }}
          ANDROID_KEY_ALIAS: ${{ secrets.ANDROID_KEY_ALIAS }}
          ANDROID_KEY_PASSWORD: ${{ secrets.ANDROID_KEY_PASSWORD }}
        run: |
          cd android
          gradle assembleRelease --stacktrace
          mkdir -p ../dist
          cp app/build/outputs/apk/release/app-release*.apk ../dist/synthos-node.apk

      - name: Verify Signed APK
        if: steps.prep-keystore.outputs.has_keystore == 'true'
        run: |
          BUILD_TOOLS_VERSION=$(ls "$ANDROID_HOME/build-tools" | sort -V | tail -n 1)
          APKSIGNER="$ANDROID_HOME/build-tools/$BUILD_TOOLS_VERSION/apksigner"
          echo "Verifying APK with $APKSIGNER..."
          "$APKSIGNER" verify --verbose dist/synthos-node.apk

      - name: Upload Android APK
        uses: actions/upload-artifact@v4
        with:
          name: dist-android
          path: dist/synthos-node.apk
          retention-days: 14

  checksums-and-release:
    needs: [build, build-android]
    runs-on: ubuntu-latest
    permissions:
      contents: write
    steps:
      - uses: actions/download-artifact@v4
        with:
          pattern: dist-*
          path: dist
          merge-multiple: true

      - name: Generate SHA256SUMS
        working-directory: dist
        run: |
          sha256sum * > SHA256SUMS
          cat SHA256SUMS

      - uses: actions/upload-artifact@v4
        with:
          name: release-assets
          path: dist/*
          retention-days: 14

      - name: Publish GitHub Release
        if: startsWith(github.ref, 'refs/tags/v')
        uses: softprops/action-gh-release@v2
        with:
          files: dist/*
          generate_release_notes: true
