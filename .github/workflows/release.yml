name: Release node binaries

# Builds real, auditable cross-platform binaries straight from this repo's
# source and publishes them as GitHub Release assets, so anyone downloading
# a SYNTHOS node binary can trace it back to the exact commit that built it
# -- rather than depending on some separate, unaudited build process.
#
# Two binaries are published, and they are NOT the same thing:
#   - synthos-node-<os>-<arch>[.exe]   built from cmd/silentnode: the
#     outbound-only Proof-of-Uptime candidate client (no open ports, no
#     consensus participation). This is what the public "run a node"
#     download should point at for someone just getting started.
#   - synthosd-<os>-<arch>[.exe]       built from cmd/synthosd: the real
#     validator/consensus binary. Running this does not by itself make
#     anyone an active validator -- joining the live validator set is
#     still a separate, deliberate operator step (shared genesis, peer
#     registration, consensus tokens), not something this workflow grants.
#
# Triggers:
#   - Pushing a tag like v1.2.3 publishes a real GitHub Release.
#   - workflow_dispatch (manual run from the Actions tab) builds the same
#     artifacts without publishing a Release, so the build can be sanity
#     checked before cutting a real tag.

on:
  push:
    tags:
      - "v*.*.*"
  workflow_dispatch: {}

permissions:
  contents: write

jobs:
  build:
    runs-on: ubuntu-latest
    strategy:
      matrix:
        include:
          - goos: linux
            goarch: amd64
            ext: ""
          - goos: darwin
            goarch: arm64
            ext: ""
          - goos: darwin
            goarch: amd64
            ext: ""
          - goos: windows
            goarch: amd64
            ext: ".exe"
    steps:
      - uses: actions/checkout@v4

      - uses: actions/setup-go@v5
        with:
          go-version-file: go.mod
          cache: true

      - name: Build synthos-node (cmd/silentnode -- Proof-of-Uptime candidate client)
        env:
          GOOS: ${{ matrix.goos }}
          GOARCH: ${{ matrix.goarch }}
          CGO_ENABLED: "0"
        run: |
          out="dist/synthos-node-${{ matrix.goos }}-${{ matrix.goarch }}${{ matrix.ext }}"
          mkdir -p dist
          go build -trimpath -ldflags="-s -w" -o "$out" ./cmd/silentnode
          echo "built $out"

      - name: Build synthosd (cmd/synthosd -- real validator/consensus binary)
        env:
          GOOS: ${{ matrix.goos }}
          GOARCH: ${{ matrix.goarch }}
          CGO_ENABLED: "0"
        run: |
          out="dist/synthosd-${{ matrix.goos }}-${{ matrix.goarch }}${{ matrix.ext }}"
          go build -trimpath -ldflags="-s -w" -o "$out" ./cmd/synthosd
          echo "built $out"

      - uses: actions/upload-artifact@v4
        with:
          name: dist-${{ matrix.goos }}-${{ matrix.goarch }}
          path: dist/*
          retention-days: 14

  checksums-and-release:
    needs: build
    runs-on: ubuntu-latest
    steps:
      - uses: actions/download-artifact@v4
        with:
          pattern: dist-*
          path: dist
          merge-multiple: true

      - name: Generate SHA256SUMS
        working-directory: dist
        run: |
          sha256sum * > SHA256SUMS
          cat SHA256SUMS

      - uses: actions/upload-artifact@v4
        with:
          name: release-assets
          path: dist/*
          retention-days: 14

      - name: Publish GitHub Release
        if: startsWith(github.ref, 'refs/tags/v')
        uses: softprops/action-gh-release@v2
        with:
          files: dist/*
          generate_release_notes: true
