plugins {
    id 'com.android.application'
}

android {
    namespace 'com.synthoscollective.node'
    compileSdk 34

    defaultConfig {
        applicationId "com.synthoscollective.node"
        minSdk 26
        targetSdk 34
        versionCode 1
        versionName "1.0.0"

        testInstrumentationRunner "androidx.test.runner.AndroidJUnitRunner"
    }

    signingConfigs {
        release {
            def keystorePath = System.getenv("ANDROID_KEYSTORE_FILE") ?: project.findProperty("SYNTHOS_KEYSTORE_FILE") ?: "synthos-release.keystore"
            def keystorePassword = System.getenv("ANDROID_KEYSTORE_PASSWORD") ?: project.findProperty("SYNTHOS_KEYSTORE_PASSWORD") ?: ""
            def keyAliasVal = System.getenv("ANDROID_KEY_ALIAS") ?: project.findProperty("SYNTHOS_KEY_ALIAS") ?: ""
            def keyPasswordVal = System.getenv("ANDROID_KEY_PASSWORD") ?: project.findProperty("SYNTHOS_KEY_PASSWORD") ?: ""

            if (file(keystorePath).exists() && keystorePassword) {
                storeFile file(keystorePath)
                storePassword keystorePassword
                keyAlias keyAliasVal
                keyPassword keyPasswordVal
                v1SigningEnabled true
                v2SigningEnabled true
            }
        }
    }

    buildTypes {
        release {
            def hasSigning = signingConfigs.release.storeFile != null && signingConfigs.release.storePassword != null
            if (hasSigning) {
                signingConfig signingConfigs.release
            }
            minifyEnabled false
            proguardFiles getDefaultProguardFile('proguard-android-optimize.txt'), 'proguard-rules.pro'
        }
        debug {
            minifyEnabled false
        }
    }
    compileOptions {
        sourceCompatibility JavaVersion.VERSION_17
        targetCompatibility JavaVersion.VERSION_17
    }
}

dependencies {
    implementation 'androidx.appcompat:appcompat:1.6.1'
    implementation 'androidx.core:core:1.12.0'
    implementation 'com.google.android.material:material:1.11.0'
    implementation 'androidx.constraintlayout:constraintlayout:2.1.4'
    implementation 'org.bouncycastle:bcprov-jdk18on:1.78.1'
}
