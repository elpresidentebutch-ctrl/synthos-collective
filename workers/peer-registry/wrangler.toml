name = "synthos-peer-registry"
main = "src/index.js"
compatibility_date = "2024-12-01"

# KV namespace for peer storage
[[kv_namespaces]]
binding = "PEERS"
id = "0c94398dd5f544e58acd6321ff198d2a"

# Durable Object for WebRTC signaling (WebSocket relay)
[durable_objects]
bindings = [
  { name = "SIGNALING", class_name = "SignalingDO" }
]

[[migrations]]
tag = "v1"
new_sqlite_classes = ["SignalingDO"]
