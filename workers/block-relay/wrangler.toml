name = "synthos-block-relay"
main = "src/index.js"
compatibility_date = "2024-12-01"

# Durable Object for persistent block feed storage
[durable_objects]
bindings = [
  { name = "RELAY", class_name = "BlockRelayDO" }
]

[[migrations]]
tag = "v1"
new_sqlite_classes = ["BlockRelayDO"]

# RELAY_SECRET — shared secret validators use to push blocks (set via wrangler secret put RELAY_SECRET)
# Set this to the same value in the validator's RELAY_SECRET env var.
#
# Example deploy:
#   wrangler deploy --name synthos-block-relay
