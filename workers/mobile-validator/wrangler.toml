name = "synthos-mobile"
main = "src/index.js"
compatibility_date = "2024-12-01"

# Static assets (index.html, sw.js, manifest.json) are imported in src/index.js.
# No KV, Durable Objects, or secrets needed — this worker serves a static PWA.

# NOTE: Cloudflare Workers import non-JS files as text modules by default.
# If you get import errors, add these rules:
[rules]
  [[rules]]
  type = "Text"
  globs = ["**/*.html", "**/*.json", "**/runtime.js"]
  fallthrough = true
