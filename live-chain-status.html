<!doctype html>
<html lang="en">
  <head>
    <meta charset="utf-8" />
    <meta name="viewport" content="width=device-width, initial-scale=1" />
    <title>SYNTHOS Live Chain Status</title>
    <style>
      :root {
        color-scheme: dark;
        font-family: Inter, ui-sans-serif, system-ui, -apple-system, BlinkMacSystemFont, "Segoe UI", sans-serif;
        background: #07090d;
        color: #f7fbff;
      }

      body {
        margin: 0;
        min-height: 100vh;
        background:
          linear-gradient(135deg, rgba(0, 188, 212, 0.16), transparent 32rem),
          linear-gradient(315deg, rgba(255, 214, 10, 0.12), transparent 28rem),
          #07090d;
      }

      main {
        box-sizing: border-box;
        width: min(1080px, calc(100% - 32px));
        margin: 0 auto;
        padding: 48px 0;
      }

      header {
        display: flex;
        align-items: end;
        justify-content: space-between;
        gap: 24px;
        border-bottom: 1px solid rgba(255, 255, 255, 0.12);
        padding-bottom: 24px;
      }

      h1 {
        margin: 0;
        font-size: clamp(2rem, 5vw, 4.5rem);
        line-height: 0.95;
        letter-spacing: 0;
      }

      .status-pill {
        border: 1px solid rgba(47, 225, 169, 0.4);
        background: rgba(47, 225, 169, 0.1);
        color: #85ffd6;
        border-radius: 999px;
        padding: 8px 12px;
        font-size: 0.85rem;
        white-space: nowrap;
      }

      .grid {
        display: grid;
        grid-template-columns: repeat(4, minmax(0, 1fr));
        gap: 14px;
        margin-top: 28px;
      }

      .metric, .panel {
        border: 1px solid rgba(255, 255, 255, 0.12);
        background: rgba(255, 255, 255, 0.06);
        border-radius: 8px;
        padding: 18px;
      }

      .label {
        color: #91a0b8;
        font-size: 0.72rem;
        font-weight: 700;
        letter-spacing: 0.08em;
        text-transform: uppercase;
      }

      .value {
        margin-top: 10px;
        font-size: clamp(1.6rem, 4vw, 2.6rem);
        font-weight: 800;
        overflow-wrap: anywhere;
      }

      .panel {
        margin-top: 14px;
      }

      pre {
        margin: 12px 0 0;
        max-height: 360px;
        overflow: auto;
        white-space: pre-wrap;
        color: #d9e7ff;
      }

      @media (max-width: 820px) {
        header {
          align-items: start;
          flex-direction: column;
        }

        .grid {
          grid-template-columns: repeat(2, minmax(0, 1fr));
        }
      }

      @media (max-width: 520px) {
        .grid {
          grid-template-columns: 1fr;
        }
      }
    </style>
  </head>
  <body>
    <main>
      <header>
        <div>
          <div class="label">Global Collective DEX of SYNTHOS</div>
          <h1>Live Chain Status</h1>
        </div>
        <div id="connection" class="status-pill">Connecting...</div>
      </header>

      <section class="grid" aria-label="SYNTHOS chain metrics">
        <article class="metric">
          <div class="label">Chain</div>
          <div id="chainId" class="value">-</div>
        </article>
        <article class="metric">
          <div class="label">Height</div>
          <div id="height" class="value">-</div>
        </article>
        <article class="metric">
          <div class="label">Immune Nodes</div>
          <div id="immuneNodes" class="value">-</div>
        </article>
        <article class="metric">
          <div class="label">Sovereign Proofs</div>
          <div id="proofs" class="value">-</div>
        </article>
      </section>

      <section class="panel">
        <div class="label">Tip Hash</div>
        <pre id="tip">-</pre>
      </section>

      <section class="panel">
        <div class="label">Raw RPC Response</div>
        <pre id="raw">Waiting for local RPC at http://localhost:8080</pre>
      </section>
    </main>

    <script>
      const RPC = "http://localhost:8080";
      const $ = (id) => document.getElementById(id);

      async function load() {
        try {
          const [statusRes, immuneRes] = await Promise.all([
            fetch(`${RPC}/status`),
            fetch(`${RPC}/immune/status`),
          ]);
          if (!statusRes.ok) throw new Error(`/status ${statusRes.status}`);
          if (!immuneRes.ok) throw new Error(`/immune/status ${immuneRes.status}`);

          const [status, immune] = await Promise.all([
            statusRes.json(),
            immuneRes.json(),
          ]);

          $("connection").textContent = "Connected to local Synthos RPC";
          $("chainId").textContent = status.chain_id || "-";
          $("height").textContent = status.height ?? "-";
          $("immuneNodes").textContent =
            immune.active_immune_nodes ?? status.immune?.active_immune_nodes ?? "-";
          $("proofs").textContent =
            immune.sovereign_proofs ?? status.immune?.sovereign_proofs ?? "-";
          $("tip").textContent = status.tip || "-";
          $("raw").textContent = JSON.stringify({ status, immune }, null, 2);
        } catch (err) {
          $("connection").textContent = `RPC offline: ${err.message}`;
          $("raw").textContent = `Could not reach ${RPC}\n${err.stack || err.message}`;
        }
      }

      load();
      setInterval(load, 5000);
    </script>
  </body>
</html>
